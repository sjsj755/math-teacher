name: math_up_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.4.0+1

environment:
  sdk: ^3.12.2

dependencies:
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_math_fork: ^0.7.4
  http: ^1.6.0
  intl: ^0.20.2
  path: ^1.9.1
  path_provider: ^2.1.6
  sqflite: ^2.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.6

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - lib/core/db/migrations/

# sqlite3（sqflite_common_ffi 的传递依赖，仅测试用）在构建时默认从 GitHub
# 下载预编译库；此处改为使用系统 SQLite，避免构建依赖公网下载。
hooks:
  user_defines:
    sqlite3:
      source: system
